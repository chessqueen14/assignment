<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Hero Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
        }

        /* Hero Section */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px 8%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* Text Content */
        .hero-text {
            flex: 1;
            max-width: 600px;
            padding-right: 50px;
        }

        .hero-text h1 {
            font-size: 56px;
            color: white;
            margin-bottom: 20px;
            line-height: 1.2;
            letter-spacing: -1px;
        }

        .hero-text h1 span {
            color: #ffd700;
        }

        .hero-text p {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 35px;
            line-height: 1.8;
        }

        .hero-text .cta-buttons {
            display: flex;
            gap: 15px;
        }

        .hero-text button {
            padding: 16px 35px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #ffd700;
            color: #333;
        }

        .btn-primary:hover {
            background: #ffed4a;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: white;
            border: 2px solid white;
        }

        .btn-secondary:hover {
            background: white;
            color: #667eea;
            transform: translateY(-3px);
        }

        /* Features */
        .features {
            display: flex;
            gap: 30px;
            margin-top: 50px;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 15px;
        }

        .feature-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* Image Container */
        .hero-image {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-image img {
            max-width: 500px;
            width: 100%;
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* Responsive for Mobile */
        @media (max-width: 1024px) {
            .hero {
                padding: 40px 5%;
            }
            .hero-text h1 {
                font-size: 42px;
            }
            .hero-image img {
                max-width: 400px;
            }
        }

        @media (max-width: 768px) {
            .hero {
                flex-direction: column;
                text-align: center;
                padding: 60px 20px;
                justify-content: center;
            }

            .hero-text {
                padding-right: 0;
                margin-bottom: 40px;
            }

            .hero-text h1 {
                font-size: 36px;
            }

            .hero-text p {
                font-size: 17px;
            }

            .hero-image {
                width: 100%;
            }

            .hero-image img {
                max-width: 350px;
            }

            .cta-buttons {
                justify-content: center;
            }

            .features {
                justify-content: center;
                flex-wrap: wrap;
            }

            .feature {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .hero-text h1 {
                font-size: 28px;
            }

            .cta-buttons {
                flex-direction: column;
            }

            .hero-text button {
                width: 100%;
            }

            .features {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>

    <section class="hero">
        <div class="hero-text">
            <h1>Welcome to <span>My Website</span></h1>
            <p>
                This is a responsive hero section built using Flexbox. 
                It automatically adjusts for mobile, tablet, and desktop screens 
                with smooth animations and modern styling.
            </p>
            
            <div class="cta-buttons">
                <button class="btn-primary">Get Started</button>
                <button class="btn-secondary">Learn More</button>
            </div>

            <div class="features">
                <div class="feature">
                    <div class="feature-icon">⚡</div>
                    <span>Fast Loading</span>
                </div>
                <div class="feature">
                    <div class="feature-icon">📱</div>
                    <span>Mobile Ready</span>
                </div>
                <div class="feature">
                    <div class="feature-icon">🎨</div>
                    <span>Modern Design</span>
                </div>
            </div>
        </div>

        <div class="hero-image">
            <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=500&h=500&fit=crop" alt="Hero Image">
        </div>
    </section>

</body>
</html>
