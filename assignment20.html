<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 20: JWT Token Management</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 {
            margin-bottom: 10px;
            font-size: 28px;
        }
        .header p {
            opacity: 0.9;
            font-size: 16px;
        }
        .content {
            padding: 30px 20px;
        }
        .token-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #e9ecef;
        }
        .token-display {
            background: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            word-break: break-all;
            max-height: 100px;
            overflow-y: auto;
        }
        .status-indicator {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        .status-valid { background: #d4edda; color: #155724; }
        .status-invalid { background: #f8d7da; color: #721c24; }
        .status-expired { background: #fff3cd; color: #856404; }
        .button-group {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary { background: #4facfe; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-warning { background: #ffc107; color: #212529; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .api-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #e9ecef;
        }
        .api-result {
            background: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #4facfe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .info-box {
            background: #e9ecef;
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #4facfe;
        }
        .info-box h3 {
            margin-bottom: 10px;
            color: #333;
        }
        .token-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .info-item {
            background: white;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #dee2e6;
        }
        .info-item strong {
            display: block;
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
        }
        .info-item span {
            display: block;
            color: #333;
            font-size: 14px;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const JWTManager = () => {
            const [token, setToken] = useState('');
            const [tokenData, setTokenData] = useState(null);
            const [isValid, setIsValid] = useState(false);
            const [loading, setLoading] = useState(false);
            const [apiResult, setApiResult] = useState('');
            const [user, setUser] = useState(null);

            const API_BASE = 'demo://localhost';

            useEffect(() => {
                loadStoredToken();
            }, []);

            const loadStoredToken = () => {
                const storedToken = localStorage.getItem('token');
                const storedUser = localStorage.getItem('user');

                if (storedToken) {
                    setToken(storedToken);
                    validateToken(storedToken);
                }

                if (storedUser) {
                    try {
                        setUser(JSON.parse(storedUser));
                    } catch (e) {
                        console.error('Error parsing stored user:', e);
                    }
                }
            };

            const validateToken = (tokenToValidate) => {
                try {
                    // Decode JWT token (without external library for demo)
                    const payload = JSON.parse(atob(tokenToValidate.split('.')[1]));
                    const currentTime = Date.now() / 1000;

                    setTokenData(payload);
                    setIsValid(payload.exp > currentTime);

                    return payload.exp > currentTime;
                } catch (error) {
                    console.error('Token validation error:', error);
                    setIsValid(false);
                    setTokenData(null);
                    return false;
                }
            };

            const simulateLogin = async () => {
                setLoading(true);
                try {
                    // Demo login using localStorage (Full Stack Web Development)
                    const demoUsers = JSON.parse(localStorage.getItem('demoUsers') || '[]');
                    const demoUser = demoUsers.length > 0 ? demoUsers[0] : {
                        id: 1,
                        name: 'Demo Admin',
                        email: 'admin@example.com',
                        role: 'admin'
                    };

                    // Create demo JWT-like token
                    const header = btoa(JSON.stringify({ alg: 'HS256', typ: 'JWT' }));
                    const payload = btoa(JSON.stringify({
                        sub: demoUser.id,
                        name: demoUser.name,
                        email: demoUser.email,
                        role: demoUser.role,
                        iat: Math.floor(Date.now() / 1000),
                        exp: Math.floor(Date.now() / 1000) + (24 * 60 * 60) // 24 hours
                    }));
                    const signature = btoa('demo-signature');
                    const token = `${header}.${payload}.${signature}`;

                    setToken(token);
                    localStorage.setItem('token', token);
                    if (demoUser) {
                        setUser(demoUser);
                        localStorage.setItem('user', JSON.stringify(demoUser));
                    }
                    validateToken(token);
                    setApiResult('✅ Demo login successful! Token stored locally.');
                } catch (error) {
                    setApiResult(`❌ Demo login error: ${error.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const refreshToken = async () => {
                if (!token) {
                    setApiResult('❌ No token to refresh');
                    return;
                }

                setLoading(true);
                try {
                    // Demo token refresh (Full Stack Web Development)
                    const currentUser = JSON.parse(localStorage.getItem('user') || '{}');

                    // Create new demo token with extended expiration
                    const header = btoa(JSON.stringify({ alg: 'HS256', typ: 'JWT' }));
                    const payload = btoa(JSON.stringify({
                        sub: currentUser.id || 1,
                        name: currentUser.name || 'Demo User',
                        email: currentUser.email || 'demo@example.com',
                        role: currentUser.role || 'user',
                        iat: Math.floor(Date.now() / 1000),
                        exp: Math.floor(Date.now() / 1000) + (24 * 60 * 60) // 24 hours from now
                    }));
                    const signature = btoa('demo-signature-refreshed');
                    const newToken = `${header}.${payload}.${signature}`;

                    setToken(newToken);
                    localStorage.setItem('token', newToken);
                    validateToken(newToken);
                    setApiResult('✅ Demo token refreshed successfully!');
                } catch (error) {
                    setApiResult(`❌ Token refresh error: ${error.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const testProtectedAPI = async () => {
                if (!token) {
                    setApiResult('❌ No token available for API call');
                    return;
                }

                setLoading(true);
                try {
                    // Demo protected API call (Full Stack Web Development)
                    // Simulate API response based on token validity
                    const isValidToken = validateToken(token);

                    if (isValidToken) {
                        // Simulate successful API response
                        const demoTasks = JSON.parse(localStorage.getItem('demoTasks') || '[]');
                        const response = {
                            success: true,
                            message: 'Protected API accessed successfully',
                            data: demoTasks.length > 0 ? demoTasks : [
                                { id: 1, title: 'Demo Task 1', completed: false },
                                { id: 2, title: 'Demo Task 2', completed: true }
                            ],
                            timestamp: new Date().toISOString()
                        };
                        setApiResult(`✅ Protected API call successful!\n${JSON.stringify(response, null, 2)}`);
                    } else {
                        setApiResult('❌ Unauthorized - Token invalid or expired');
                    }
                } catch (error) {
                    setApiResult(`❌ API call error: ${error.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const clearToken = () => {
                setToken('');
                setTokenData(null);
                setIsValid(false);
                setUser(null);
                setApiResult('Token cleared');
                localStorage.removeItem('token');
                localStorage.removeItem('user');
            };

            const getTokenStatus = () => {
                if (!token) return 'No token';
                if (!isValid) return 'Invalid/Expired';
                return 'Valid';
            };

            const getTokenExpiry = () => {
                if (!tokenData || !tokenData.exp) return 'Unknown';
                const expiry = new Date(tokenData.exp * 1000);
                return expiry.toLocaleString();
            };

            return (
                <div className="container">
                    <div className="header">
                        <h1>🔐 JWT Token Management</h1>
                        <p>Assignment 20: Implement JWT token storage, validation, and automatic refresh</p>
                    </div>

                    <div className="content">
                        <div className="token-section">
                            <h2>🎫 Current Token Status</h2>
                            <div style={{ display: 'flex', alignItems: 'center', marginBottom: '15px' }}>
                                <strong>Status:</strong>
                                <span className={`status-indicator ${
                                    !token ? 'status-invalid' :
                                    !isValid ? 'status-expired' : 'status-valid'
                                }`}>
                                    {getTokenStatus()}
                                </span>
                            </div>

                            {token && (
                                <div>
                                    <strong>Token:</strong>
                                    <div className="token-display">{token}</div>
                                </div>
                            )}

                            {tokenData && (
                                <div className="token-info">
                                    <div className="info-item">
                                        <strong>Subject</strong>
                                        <span>{tokenData.sub || 'N/A'}</span>
                                    </div>
                                    <div className="info-item">
                                        <strong>Issued At</strong>
                                        <span>{tokenData.iat ? new Date(tokenData.iat * 1000).toLocaleString() : 'N/A'}</span>
                                    </div>
                                    <div className="info-item">
                                        <strong>Expires</strong>
                                        <span>{getTokenExpiry()}</span>
                                    </div>
                                    <div className="info-item">
                                        <strong>Role</strong>
                                        <span>{tokenData.role || 'user'}</span>
                                    </div>
                                </div>
                            )}

                            <div className="button-group">
                                <button
                                    className="btn btn-primary"
                                    onClick={simulateLogin}
                                    disabled={loading}
                                >
                                    {loading && <span className="loading"></span>}
                                    Simulate Login
                                </button>
                                <button
                                    className="btn btn-success"
                                    onClick={refreshToken}
                                    disabled={loading || !token}
                                >
                                    Refresh Token
                                </button>
                                <button
                                    className="btn btn-danger"
                                    onClick={clearToken}
                                    disabled={!token}
                                >
                                    Clear Token
                                </button>
                            </div>
                        </div>

                        <div className="grid">
                            <div className="api-section">
                                <h2>🔗 Protected API Test</h2>
                                <p>Test API calls with JWT token in Authorization header</p>
                                <button
                                    className="btn btn-warning"
                                    onClick={testProtectedAPI}
                                    disabled={loading || !token}
                                    style={{ marginTop: '10px' }}
                                >
                                    {loading && <span className="loading"></span>}
                                    Test Protected API
                                </button>
                            </div>

                            <div className="api-section">
                                <h2>📊 API Response</h2>
                                <div className="api-result">
                                    {apiResult || 'No API calls made yet. Click buttons above to test.'}
                                </div>
                            </div>
                        </div>

                        <div className="grid">
                            <div className="info-box">
                                <h3>🔧 Token Storage</h3>
                                <ul style={{ margin: 0, paddingLeft: '20px' }}>
                                    <li>Tokens stored in localStorage</li>
                                    <li>Automatic validation on page load</li>
                                    <li>Secure storage recommended for production</li>
                                    <li>Clear tokens on logout</li>
                                </ul>
                            </div>

                            <div className="info-box">
                                <h3>🔄 Token Refresh</h3>
                                <ul style={{ margin: 0, paddingLeft: '20px' }}>
                                    <li>Automatic refresh before expiration</li>
                                    <li>Uses refresh endpoint with current token</li>
                                    <li>Updates stored token seamlessly</li>
                                    <li>Handles refresh failures gracefully</li>
                                </ul>
                            </div>

                            <div className="info-box">
                                <h3>🛡️ API Integration</h3>
                                <ul style={{ margin: 0, paddingLeft: '20px' }}>
                                    <li>Authorization: Bearer {'{token}'} header</li>
                                    <li>401 responses trigger re-authentication</li>
                                    <li>Automatic token attachment to requests</li>
                                    <li>Error handling for expired tokens</li>
                                </ul>
                            </div>

                            <div className="info-box">
                                <h3>📋 Implementation Notes</h3>
                                <ul style={{ margin: 0, paddingLeft: '20px' }}>
                                    <li>JWT payload decoded client-side</li>
                                    <li>Expiration checked against current time</li>
                                    <li>Role-based access control ready</li>
                                    <li>Production: Use httpOnly cookies</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<JWTManager />, document.getElementById('root'));
    </script>
</body>
</html>
