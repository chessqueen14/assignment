<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 23: Role-Based UI Components</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f8fafc; min-height: 100vh; padding: 24px; }
        .app-container { max-width: 1100px; margin: 0 auto; background: #0f172a; border-radius: 24px; overflow: hidden; box-shadow: 0 30px 80px rgba(15, 23, 42, 0.55); }
        .hero { background: linear-gradient(135deg, #2563eb 0%, #2563eb 55%, #0ea5e9 100%); padding: 34px; text-align: center; }
        .hero h1 { font-size: 2.6rem; margin-bottom: 12px; }
        .hero p { opacity: 0.92; font-size: 1rem; max-width: 860px; margin: 0 auto; }
        .layout { display: grid; grid-template-columns: 1.3fr 0.7fr; gap: 24px; padding: 28px; }
        @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }
        .panel { background: #111827; border-radius: 20px; border: 1px solid rgba(148, 163, 184, 0.18); padding: 24px; }
        .panel h2 { margin-bottom: 18px; font-size: 1.35rem; }
        .role-banner { padding: 16px 20px; border-radius: 16px; margin-bottom: 20px; background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.25); }
        .role-banner strong { color: #cffafe; }
        .toggle-group { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
        .toggle-button { padding: 12px 18px; border-radius: 14px; border: 1px solid transparent; cursor: pointer; font-weight: 700; transition: all 0.2s ease; }
        .toggle-button.active { background: #3b82f6; color: white; border-color: #60a5fa; }
        .toggle-button.inactive { background: rgba(148, 163, 184, 0.14); color: #cbd5e1; }
        .card { background: #1f2937; border-radius: 18px; border: 1px solid rgba(148, 163, 184, 0.14); padding: 22px; margin-bottom: 18px; }
        .card h3 { margin-bottom: 12px; }
        .card p { line-height: 1.7; color: #cbd5e1; }
        .card small { display: block; margin-top: 12px; color: #94a3b8; }
        .action-list { list-style: none; padding-left: 0; margin-top: 16px; display: grid; gap: 10px; }
        .action-list li { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: rgba(148, 163, 184, 0.08); border-radius: 14px; }
        .badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-size: 0.95rem; font-weight: 700; }
        .badge.admin { background: #164e63; color: #dbeafe; }
        .badge.user { background: #14532d; color: #dcfce7; }
        .badge.locked { background: #831843; color: #fee2e2; }
        .info-panel { background: #111827; border: 1px solid rgba(148, 163, 184, 0.16); border-radius: 18px; padding: 20px; line-height: 1.8; }
        .info-panel h3 { margin-bottom: 14px; }
        .info-panel li { margin-bottom: 10px; }
        .feature-button { padding: 12px 18px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; transition: opacity 0.2s ease; }
        .feature-button:hover { opacity: 0.9; }
        .feature-button.view { background: #22c55e; color: white; }
        .feature-button.admin { background: #2563eb; color: white; }
        .feature-button.locked { background: #ef4444; color: white; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const RoleBasedUI = () => {
            const [role, setRole] = useState('user');

            const features = [
                { id: 1, label: 'View Tasks', availableTo: ['user', 'admin'], style: 'view', description: 'All users can view tasks and task details.' },
                { id: 2, label: 'Create Task', availableTo: ['user', 'admin'], style: 'view', description: 'Users can create tasks using the task form.' },
                { id: 3, label: 'Edit Task', availableTo: ['user', 'admin'], style: 'view', description: 'Users can edit tasks they own or are assigned to.' },
                { id: 4, label: 'Delete Task', availableTo: ['admin'], style: 'admin', description: 'Only admins may delete tasks across the system.' },
                { id: 5, label: 'User Management', availableTo: ['admin'], style: 'admin', description: 'Admins can manage users, roles, and permissions.' },
                { id: 6, label: 'Audit Logs', availableTo: ['admin'], style: 'admin', description: 'Admins can inspect recent activity and security logs.' }
            ];

            const roleDescriptions = {
                admin: 'Admin users can access all application features, manage other users, and perform privileged operations.',
                user: 'Regular users can work with tasks and use standard app functionality without administrative rights.'
            };

            return (
                <div className="app-container">
                    <div className="hero">
                        <h1>🛡️ Role-Based UI Components</h1>
                        <p>Assignment 23: Build conditional UI rendering based on user roles and restrict access to privileged features.</p>
                    </div>

                    <div className="layout">
                        <section className="panel">
                            <div className="role-banner">
                                <strong>Current Role:</strong> <span className={`badge ${role}`}>{role.toUpperCase()}</span>
                            </div>

                            <div className="toggle-group">
                                <button className={`toggle-button ${role === 'user' ? 'active' : 'inactive'}`} onClick={() => setRole('user')}>Switch to User</button>
                                <button className={`toggle-button ${role === 'admin' ? 'active' : 'inactive'}`} onClick={() => setRole('admin')}>Switch to Admin</button>
                            </div>

                            {features.map(feature => {
                                const allowed = feature.availableTo.includes(role);
                                return (
                                    <div key={feature.id} className="card">
                                        <div>
                                            <h3>{feature.label}</h3>
                                            <p>{feature.description}</p>
                                            <small>{allowed ? 'Available to this role' : 'Restricted for this role'}</small>
                                        </div>
                                        <button className={`feature-button ${allowed ? feature.style : 'locked'}`} disabled={!allowed}>
                                            {allowed ? 'Access' : 'Locked'}
                                        </button>
                                    </div>
                                );
                            })}
                        </section>

                        <aside className="panel">
                            <div className="info-panel">
                                <h3>Role Behavior</h3>
                                <p>{roleDescriptions[role]}</p>
                                <ul>
                                    <li><strong>User:</strong> Can create and edit tasks, but cannot delete tasks or manage users.</li>
                                    <li><strong>Admin:</strong> Can perform all actions, including deleting tasks and managing user roles.</li>
                                </ul>
                            </div>

                            <div className="info-panel">
                                <h3>How to Use Role-Based Components</h3>
                                <ul>
                                    <li>Render admin-only controls conditionally based on user role.</li>
                                    <li>Hide or disable actions that are not permitted.</li>
                                    <li>Show contextual messaging when a feature is locked.</li>
                                    <li>Use role metadata from authentication tokens or user profiles.</li>
                                </ul>
                            </div>

                            <div className="info-panel">
                                <h3>Implementation Notes</h3>
                                <ul>
                                    <li>Example tools: React context, protected routes, and higher-order components.</li>
                                    <li>Store role information securely in auth state or token claims.</li>
                                    <li>Always enforce role checks on the backend as well as the UI.</li>
                                    <li>Use UI feedback to explain why an action is unavailable.</li>
                                </ul>
                            </div>
                        </aside>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<RoleBasedUI />, document.getElementById('root'));
    </script>
</body>
</html>
