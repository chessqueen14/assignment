<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 22: Full CRUD Integration</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #232526 0%, #414345 100%);
            min-height: 100vh;
            padding: 20px;
            color: #111827;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 30px 90px rgba(0,0,0,0.12);
            overflow: hidden;
        }
        .hero {
            padding: 32px 34px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            text-align: center;
        }
        .hero h1 {
            font-size: 2.4rem;
            margin-bottom: 8px;
        }
        .hero p {
            opacity: 0.92;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
        }
        .grid {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 24px;
            padding: 28px;
        }
        @media (max-width: 920px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
        .panel {
            background: #f8fafc;
            border-radius: 18px;
            border: 1px solid #e2e8f0;
            padding: 22px;
        }
        .panel h2 {
            margin-bottom: 18px;
            font-size: 1.4rem;
            color: #111827;
        }
        .task-list {
            display: grid;
            gap: 16px;
        }
        .task-card {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            padding: 20px;
            border-radius: 16px;
            background: white;
            border: 1px solid #e2e8f0;
            transition: transform 0.2s ease;
        }
        .task-card:hover {
            transform: translateY(-2px);
        }
        .task-card.completed {
            opacity: 0.75;
            background: #ecfdf5;
        }
        .task-content h3 {
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        .task-content p {
            margin-bottom: 10px;
            line-height: 1.6;
            color: #4b5563;
        }
        .task-content small {
            display: inline-block;
            color: #6b7280;
            font-size: 0.9rem;
        }
        .task-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-success { background: #16a34a; color: white; }
        .task-form {
            display: grid;
            gap: 16px;
        }
        .task-form label {
            display: block;
            font-weight: 600;
            color: #111827;
            margin-bottom: 8px;
        }
        .task-form input,
        .task-form textarea {
            width: 100%;
            border-radius: 14px;
            border: 1px solid #cbd5e1;
            padding: 14px 16px;
            font-size: 0.95rem;
            font-family: inherit;
            background: white;
        }
        .task-form textarea { min-height: 140px; resize: vertical; }
        .task-form-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .status-banner {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1d4ed8;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 18px;
        }
        .info-box {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            padding: 18px;
            line-height: 1.7;
        }
        .info-box h3 {
            margin-bottom: 12px;
        }
        .info-box li { margin-bottom: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const FullCrudApp = () => {
            const [tasks, setTasks] = useState([]);
            const [title, setTitle] = useState('');
            const [description, setDescription] = useState('');
            const [isSaving, setIsSaving] = useState(false);
            const [isLoading, setIsLoading] = useState(false);
            const [notification, setNotification] = useState('');
            const [editingTask, setEditingTask] = useState(null);

            const API_BASE = 'demo://localhost';

            useEffect(() => {
                loadTasks();
            }, []);

            const notify = (message) => {
                setNotification(message);
                setTimeout(() => setNotification(''), 4500);
            };

            const loadTasks = async () => {
                setIsLoading(true);
                try {
                    // Demo: Load tasks from localStorage (Full Stack Web Development)
                    const storedTasks = localStorage.getItem('demoTasks');
                    if (storedTasks) {
                        setTasks(JSON.parse(storedTasks));
                    } else {
                        const demoTasks = [
                            { id: 1, title: 'Complete Full CRUD Implementation', description: 'Ensure all create, read, update, delete operations work correctly.', completed: false },
                            { id: 2, title: 'Add Error Handling', description: 'Implement proper error handling for all API operations.', completed: false },
                            { id: 3, title: 'Test User Experience', description: 'Verify the UI provides good feedback for all operations.', completed: true }
                        ];
                        setTasks(demoTasks);
                        localStorage.setItem('demoTasks', JSON.stringify(demoTasks));
                    }
                } catch (error) {
                    console.warn(error);
                    setTasks([
                        { id: 1001, title: 'Demo task: localStorage CRUD', description: 'All operations work with browser localStorage.', completed: false }
                    ]);
                    notify('Using demo tasks from localStorage.');
                } finally {
                    setIsLoading(false);
                }
            };

            const buildTaskPayload = () => ({ title: title.trim(), description: description.trim(), completed: false });

            const createTask = async (payload) => {
                // Demo: Create task in localStorage (Full Stack Web Development)
                const storedTasks = JSON.parse(localStorage.getItem('demoTasks') || '[]');
                const newTask = { ...payload, id: Date.now(), createdAt: new Date().toISOString() };
                const updatedTasks = [newTask, ...storedTasks];
                localStorage.setItem('demoTasks', JSON.stringify(updatedTasks));
                return newTask;
            };

            const updateTask = async (id, payload) => {
                // Demo: Update task in localStorage (Full Stack Web Development)
                const storedTasks = JSON.parse(localStorage.getItem('demoTasks') || '[]');
                const updatedTasks = storedTasks.map(task =>
                    task.id === id ? { ...payload, id, updatedAt: new Date().toISOString() } : task
                );
                localStorage.setItem('demoTasks', JSON.stringify(updatedTasks));
                return updatedTasks.find(task => task.id === id);
            };

            const deleteTask = async (id) => {
                // Demo: Delete task from localStorage (Full Stack Web Development)
                const storedTasks = JSON.parse(localStorage.getItem('demoTasks') || '[]');
                const updatedTasks = storedTasks.filter(task => task.id !== id);
                localStorage.setItem('demoTasks', JSON.stringify(updatedTasks));
                return true;
            };

            const handleSubmit = async (event) => {
                event.preventDefault();
                if (!title.trim() || !description.trim()) {
                    notify('Please fill in both title and description.');
                    return;
                }
                setIsSaving(true);
                const payload = buildTaskPayload();

                try {
                    if (editingTask) {
                        const updated = await updateTask(editingTask.id, { ...editingTask, title: payload.title, description: payload.description });
                        setTasks(tasks.map(task => task.id === updated.id ? updated : task));
                        notify('Task updated successfully.');
                    } else {
                        const created = await createTask(payload);
                        setTasks([created, ...tasks]);
                        notify('Task created successfully.');
                    }
                    setTitle('');
                    setDescription('');
                    setEditingTask(null);
                } catch (error) {
                    console.error(error);
                    notify('Unable to save task. Check backend connection.');
                } finally {
                    setIsSaving(false);
                }
            };

            const handleEdit = (task) => {
                setEditingTask(task);
                setTitle(task.title);
                setDescription(task.description);
            };

            const handleToggleComplete = async (task) => {
                const payload = { ...task, completed: !task.completed };
                try {
                    const updated = await updateTask(task.id, payload);
                    setTasks(tasks.map(item => item.id === updated.id ? updated : item));
                    notify(`Task marked ${updated.completed ? 'complete' : 'incomplete'}.`);
                } catch (error) {
                    console.error(error);
                    notify('Unable to update task status.');
                }
            };

            const handleDelete = async (task) => {
                if (!confirm('Are you sure you want to delete this task?')) return;
                try {
                    await deleteTask(task.id);
                    setTasks(tasks.filter(item => item.id !== task.id));
                    notify('Task deleted successfully.');
                } catch (error) {
                    console.error(error);
                    notify('Unable to delete task.');
                }
            };

            const cancelEdit = () => {
                setEditingTask(null);
                setTitle('');
                setDescription('');
            };

            return (
                <div className="container">
                    <div className="hero">
                        <h1>🚀 Full CRUD Integration</h1>
                        <p>Assignment 22: Complete task management with create, read, update, and delete operations in React.</p>
                    </div>

                    <div className="grid">
                        <section className="panel">
                            <div className="task-header">
                                <div>
                                    <h2>Task Collection</h2>
                                    <p>{isLoading ? 'Loading tasks...' : `${tasks.length} tasks`}</p>
                                </div>
                                <button className="btn btn-primary" onClick={loadTasks} disabled={isLoading}>Refresh</button>
                            </div>

                            {notification && <div className="status-banner">{notification}</div>}

                            <div className="task-list">
                                {tasks.map((task) => (
                                    <article key={task.id} className={`task-card ${task.completed ? 'completed' : ''}`}>
                                        <div className="task-content">
                                            <h3>{task.title}</h3>
                                            <p>{task.description}</p>
                                            <small>{task.completed ? 'Completed' : 'Incomplete'}</small>
                                        </div>
                                        <div className="task-actions">
                                            <button className="btn btn-success" onClick={() => handleToggleComplete(task)}>
                                                {task.completed ? 'Undo' : 'Complete'}
                                            </button>
                                            <button className="btn btn-warning" onClick={() => handleEdit(task)}>
                                                Edit
                                            </button>
                                            <button className="btn btn-danger" onClick={() => handleDelete(task)}>
                                                Delete
                                            </button>
                                        </div>
                                    </article>
                                ))}
                            </div>
                        </section>

                        <aside className="panel">
                            <h2>{editingTask ? 'Edit Task' : 'Add New Task'}</h2>
                            <form className="task-form" onSubmit={handleSubmit}>
                                <div>
                                    <label htmlFor="taskTitle">Title</label>
                                    <input
                                        id="taskTitle"
                                        value={title}
                                        onChange={(e) => setTitle(e.target.value)}
                                        placeholder="Enter a task title"
                                        required
                                    />
                                </div>
                                <div>
                                    <label htmlFor="taskDescription">Description</label>
                                    <textarea
                                        id="taskDescription"
                                        value={description}
                                        onChange={(e) => setDescription(e.target.value)}
                                        placeholder="Describe the task"
                                        required
                                    />
                                </div>
                                <div className="task-form-actions">
                                    <button type="submit" className="btn btn-primary" disabled={isSaving}>
                                        {isSaving ? (editingTask ? 'Updating...' : 'Saving...') : (editingTask ? 'Update Task' : 'Create Task')}
                                    </button>
                                    {editingTask && (
                                        <button type="button" className="btn btn-secondary" onClick={cancelEdit}>
                                            Cancel
                                        </button>
                                    )}
                                </div>
                            </form>

                            <div className="info-box">
                                <h3>Integration Notes</h3>
                                <ul>
                                    <li>Uses GET /api/tasks to load tasks.</li>
                                    <li>Uses POST /api/tasks to create new tasks.</li>
                                    <li>Uses PUT /api/tasks/:id to update tasks.</li>
                                    <li>Uses DELETE /api/tasks/:id to remove tasks.</li>
                                </ul>
                            </div>

                            <div className="info-box">
                                <h3>Recommended Workflow</h3>
                                <ul>
                                    <li>Connect backend before testing to avoid sample fallback data.</li>
                                    <li>Edit tasks directly from the list using the Edit button.</li>
                                    <li>Complete tasks using the Complete/Undo button.</li>
                                    <li>Use Refresh to reload current backend data.</li>
                                </ul>
                            </div>
                        </aside>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<FullCrudApp />, document.getElementById('root'));
    </script>
</body>
</html>
