<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 21: Task Management Components</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            color: #333;
            padding: 20px;
        }
        .app-shell {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 18px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        .hero {
            padding: 30px 30px 15px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            text-align: center;
        }
        .hero h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .hero p {
            opacity: 0.92;
        }
        .layout {
            display: grid;
            grid-template-columns: 1.25fr 0.75fr;
            gap: 20px;
            padding: 30px;
        }
        @media (max-width: 860px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }
        .panel {
            background: #f9fafb;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #e5e7eb;
        }
        .panel h2 {
            margin-bottom: 18px;
            color: #111827;
        }
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }
        .task-header button {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .task-header button:hover {
            transform: translateY(-1px);
        }
        .task-list {
            display: grid;
            gap: 14px;
        }
        .task-card {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 15px;
            padding: 18px;
            border-radius: 14px;
            background: white;
            border: 1px solid #e5e7eb;
        }
        .task-card.completed {
            opacity: 0.75;
            background: #ecfdf5;
        }
        .task-card h3 {
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        .task-card small {
            color: #6b7280;
        }
        .task-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }
        .task-actions button {
            border: none;
            border-radius: 10px;
            padding: 8px 12px;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s ease;
        }
        .task-actions button:hover {
            opacity: 0.9;
        }
        .btn-edit { background: #2563eb; }
        .btn-toggle { background: #10b981; }
        .btn-delete { background: #ef4444; }
        .task-form {
            display: grid;
            gap: 14px;
        }
        .task-form label {
            font-weight: 600;
            color: #374151;
        }
        .task-form input,
        .task-form textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            font-size: 0.95rem;
            font-family: inherit;
        }
        .task-form textarea {
            resize: vertical;
            min-height: 100px;
        }
        .task-form button {
            width: fit-content;
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
        .task-form button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }
        .status-banner {
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 16px;
        }
        .info-box {
            background: #ffffff;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            padding: 18px;
            line-height: 1.7;
        }
        .info-box h3 {
            margin-bottom: 12px;
        }
        .info-box li {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const TaskManager = () => {
            const [tasks, setTasks] = useState([]);
            const [title, setTitle] = useState('');
            const [description, setDescription] = useState('');
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState('');
            const [editingTaskId, setEditingTaskId] = useState(null);

            const API_BASE = 'demo://localhost';

            useEffect(() => {
                fetchTasks();
            }, []);

            const showMessage = (text) => {
                setMessage(text);
                setTimeout(() => setMessage(''), 4000);
            };

            const fetchTasks = async () => {
                setLoading(true);
                try {
                    // Demo: Load tasks from localStorage (Full Stack Web Development)
                    const storedTasks = localStorage.getItem('demoTasks');
                    if (storedTasks) {
                        setTasks(JSON.parse(storedTasks));
                    } else {
                        const demoTasks = [
                            { id: 1, title: 'Complete React Components', description: 'Build reusable UI components for the task manager.', completed: false },
                            { id: 2, title: 'Implement CRUD Operations', description: 'Add create, read, update, and delete functionality.', completed: false },
                            { id: 3, title: 'Add Form Validation', description: 'Ensure user input is validated before submission.', completed: true }
                        ];
                        setTasks(demoTasks);
                        localStorage.setItem('demoTasks', JSON.stringify(demoTasks));
                    }
                } catch (error) {
                    console.warn('Demo load failed:', error);
                    setTasks([
                        { id: 1001, title: 'Demo task: localStorage works', description: 'Tasks are stored in browser localStorage.', completed: false }
                    ]);
                    showMessage('Using demo tasks from localStorage.');
                } finally {
                    setLoading(false);
                }
            };

            const saveTask = async (task) => {
                try {
                    // Demo: Save task to localStorage (Full Stack Web Development)
                    const storedTasks = JSON.parse(localStorage.getItem('demoTasks') || '[]');
                    let updatedTasks;

                    if (task.id) {
                        // Update existing task
                        updatedTasks = storedTasks.map(t => t.id === task.id ? { ...task, updatedAt: new Date().toISOString() } : t);
                    } else {
                        // Create new task
                        const newTask = { ...task, id: Date.now(), createdAt: new Date().toISOString() };
                        updatedTasks = [newTask, ...storedTasks];
                    }

                    localStorage.setItem('demoTasks', JSON.stringify(updatedTasks));
                    return task.id ? task : updatedTasks[0];
                } catch (error) {
                    console.error('Demo save error:', error);
                    return null;
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!title.trim() || !description.trim()) {
                    showMessage('Please fill both task title and description.');
                    return;
                }
                setLoading(true);
                const payload = {
                    title: title.trim(),
                    description: description.trim(),
                    completed: false
                };
                if (editingTaskId) {
                    payload.id = editingTaskId;
                }
                const result = await saveTask(payload);
                if (result) {
                    if (editingTaskId) {
                        setTasks(tasks.map(task => task.id === editingTaskId ? result : task));
                        showMessage('Task updated successfully.');
                    } else {
                        setTasks([result, ...tasks]);
                        showMessage('Task created successfully.');
                    }
                    setTitle('');
                    setDescription('');
                    setEditingTaskId(null);
                } else {
                    showMessage('Task save failed. Check backend connectivity.');
                }
                setLoading(false);
            };

            const handleEdit = (task) => {
                setEditingTaskId(task.id);
                setTitle(task.title);
                setDescription(task.description);
            };

            const handleToggleComplete = async (task) => {
                const updatedTask = { ...task, completed: !task.completed };
                const result = await saveTask(updatedTask);
                if (result) {
                    setTasks(tasks.map(item => item.id === task.id ? result : item));
                    showMessage(`Task marked ${result.completed ? 'completed' : 'incomplete'}.`);
                } else {
                    showMessage('Unable to update task status.');
                }
            };

            const handleDelete = async (task) => {
                if (!confirm('Delete this task permanently?')) return;
                try {
                    // Demo: Delete task from localStorage (Full Stack Web Development)
                    const storedTasks = JSON.parse(localStorage.getItem('demoTasks') || '[]');
                    const updatedTasks = storedTasks.filter(t => t.id !== task.id);
                    localStorage.setItem('demoTasks', JSON.stringify(updatedTasks));
                    setTasks(updatedTasks);
                    showMessage('Task deleted successfully.');
                } catch (error) {
                    console.error('Demo delete error:', error);
                    showMessage('Unable to delete task.');
                }
            };

            return (
                <div className="app-shell">
                    <div className="hero">
                        <h1>📋 Task Management Components</h1>
                        <p>Assignment 21: Build React components to display, create, and manage tasks by connecting to the backend CRUD APIs.</p>
                    </div>

                    <div className="layout">
                        <section className="panel">
                            <div className="task-header">
                                <div>
                                    <h2>Task List</h2>
                                    <p>{loading ? 'Loading tasks...' : `${tasks.length} tasks available`}</p>
                                </div>
                                <button onClick={fetchTasks} disabled={loading}>Refresh</button>
                            </div>

                            {message && <div className="status-banner">{message}</div>}

                            <div className="task-list">
                                {tasks.map(task => (
                                    <div key={task.id} className={`task-card ${task.completed ? 'completed' : ''}`}>
                                        <div>
                                            <h3>{task.title}</h3>
                                            <p>{task.description}</p>
                                            <small>{task.completed ? 'Completed' : 'Incomplete'}</small>
                                        </div>

                                        <div className="task-actions">
                                            <button className="btn btn-toggle" onClick={() => handleToggleComplete(task)}>
                                                {task.completed ? 'Mark Incomplete' : 'Mark Complete'}
                                            </button>
                                            <button className="btn btn-edit" onClick={() => handleEdit(task)}>
                                                Edit
                                            </button>
                                            <button className="btn btn-delete" onClick={() => handleDelete(task)}>
                                                Delete
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                        <aside className="panel">
                            <h2>{editingTaskId ? 'Edit Task' : 'New Task'}</h2>
                            <form className="task-form" onSubmit={handleSubmit}>
                                <label htmlFor="title">Title</label>
                                <input
                                    id="title"
                                    value={title}
                                    onChange={(e) => setTitle(e.target.value)}
                                    placeholder="Enter task title"
                                />
                                <label htmlFor="description">Description</label>
                                <textarea
                                    id="description"
                                    value={description}
                                    onChange={(e) => setDescription(e.target.value)}
                                    placeholder="Enter task description"
                                />
                                <button type="submit" disabled={loading}>
                                    {editingTaskId ? 'Update Task' : 'Create Task'}
                                </button>
                            </form>

                            <div className="info-box">
                                <h3>How this connects to backend</h3>
                                <ul>
                                    <li>GET /api/tasks - load all tasks</li>
                                    <li>POST /api/tasks - create a task</li>
                                    <li>PUT /api/tasks/:id - update a task</li>
                                    <li>DELETE /api/tasks/:id - remove a task</li>
                                </ul>
                            </div>

                            <div className="info-box">
                                <h3>Component Responsibilities</h3>
                                <ul>
                                    <li><strong>TaskList</strong> displays task cards</li>
                                    <li><strong>TaskForm</strong> handles create/edit forms</li>
                                    <li><strong>TaskCard</strong> uses actions for edit/delete/complete</li>
                                    <li><strong>App</strong> manages state and API requests</li>
                                </ul>
                            </div>
                        </aside>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<TaskManager />, document.getElementById('root'));
    </script>
</body>
</html>
