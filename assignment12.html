<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const WeatherDashboard = () => {
            const [city, setCity] = useState('New York');
            const [weather, setWeather] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);

            const fetchWeather = async (cityName) => {
                setLoading(true);
                setError(null);
                setWeather(null);

                try {
                    // First, get coordinates for the city using Geocoding API
                    const geoResponse = await fetch(
                        `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=en&format=json`
                    );
                    
                    if (!geoResponse.ok) {
                        throw new Error('Failed to fetch location data');
                    }
                    
                    const geoData = await geoResponse.json();
                    
                    if (!geoData.results || geoData.results.length === 0) {
                        throw new Error('City not found. Please try another city.');
                    }
                    
                    const { latitude, longitude, name, country } = geoData.results[0];

                    // Then fetch weather data
                    const weatherResponse = await fetch(
                        `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true&hourly=relativehumidity_2m,apparent_temperature&daily=weathercode,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto`
                    );
                    
                    if (!weatherResponse.ok) {
                        throw new Error('Failed to fetch weather data');
                    }
                    
                    const weatherData = await weatherResponse.json();
                    
                    setWeather({
                        current: weatherData.current_weather,
                        hourly: weatherData.hourly,
                        daily: weatherData.daily,
                        location: { name, country }
                    });
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchWeather(city);
            }, []);

            const handleSearch = (e) => {
                e.preventDefault();
                if (city.trim()) {
                    fetchWeather(city);
                }
            };

            const getWeatherIcon = (code) => {
                const icons = {
                    0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
                    45: '🌫️', 48: '🌫️',
                    51: '🌧️', 53: '🌧️', 55: '🌧️',
                    61: '🌧️', 63: '🌧️', 65: '🌧️',
                    71: '🌨️', 73: '🌨️', 75: '🌨️',
                    77: '🌨️', 80: '🌦️', 81: '🌦️', 82: '🌦️',
                    85: '🌨️', 86: '🌨️',
                    95: '⛈️', 96: '⛈️', 99: '⛈️'
                };
                return icons[code] || '🌡️';
            };

            const getWeatherDescription = (code) => {
                const descriptions = {
                    0: 'Clear Sky', 1: 'Mainly Clear', 2: 'Partly Cloudy', 3: 'Overcast',
                    45: 'Foggy', 48: 'Depositing Rime Fog',
                    51: 'Light Drizzle', 53: 'Moderate Drizzle', 55: 'Dense Drizzle',
                    61: 'Slight Rain', 63: 'Moderate Rain', 65: 'Heavy Rain',
                    71: 'Slight Snow', 73: 'Moderate Snow', 75: 'Heavy Snow',
                    77: 'Snow Grains',
                    80: 'Slight Rain Showers', 81: 'Moderate Rain Showers', 82: 'Violent Rain Showers',
                    85: 'Slight Snow Showers', 86: 'Heavy Snow Showers',
                    95: 'Thunderstorm', 96: 'Thunderstorm with Hail', 99: 'Severe Thunderstorm'
                };
                return descriptions[code] || 'Unknown';
            };

            return (
                <div style={{
                    maxWidth: '600px',
                    margin: '0 auto',
                    background: 'white',
                    borderRadius: '20px',
                    boxShadow: '0 20px 60px rgba(0,0,0,0.3)',
                    overflow: 'hidden'
                }}>
                    <div style={{
                        background: 'linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)',
                        padding: '30px',
                        textAlign: 'center'
                    }}>
                        <h1 style={{ color: 'white', fontSize: '28px', marginBottom: '10px' }}>🌤️ Weather Dashboard</h1>
                        <form onSubmit={handleSearch} style={{
                            display: 'flex',
                            gap: '10px',
                            maxWidth: '400px',
                            margin: '0 auto'
                        }}>
                            <input
                                type="text"
                                value={city}
                                onChange={(e) => setCity(e.target.value)}
                                placeholder="Enter city name..."
                                style={{
                                    flex: 1,
                                    padding: '12px 15px',
                                    fontSize: '16px',
                                    border: 'none',
                                    borderRadius: '25px',
                                    outline: 'none'
                                }}
                            />
                            <button
                                type="submit"
                                style={{
                                    padding: '12px 25px',
                                    background: '#ff6b6b',
                                    color: 'white',
                                    border: 'none',
                                    borderRadius: '25px',
                                    fontSize: '16px',
                                    cursor: 'pointer',
                                    fontWeight: 'bold'
                                }}
                            >
                                Search
                            </button>
                        </form>
                    </div>

                    <div style={{ padding: '30px' }}>
                        {loading && (
                            <div style={{
                                textAlign: 'center',
                                padding: '60px 20px'
                            }}>
                                <div style={{
                                    fontSize: '50px',
                                    animation: 'spin 1s linear infinite'
                                }}>🌍</div>
                                <p style={{ color: '#666', marginTop: '15px', fontSize: '18px' }}>
                                    Fetching weather data...
                                </p>
                                <style>{`
                                    @keyframes spin {
                                        from { transform: rotate(0deg); }
                                        to { transform: rotate(360deg); }
                                    }
                                `}</style>
                            </div>
                        )}

                        {error && (
                            <div style={{
                                textAlign: 'center',
                                padding: '40px 20px',
                                background: '#ffe5e5',
                                borderRadius: '15px',
                                border: '2px solid #ff4757'
                            }}>
                                <div style={{ fontSize: '50px', marginBottom: '15px' }}>⚠️</div>
                                <p style={{ color: '#ff4757', fontSize: '18px', fontWeight: 'bold' }}>
                                    Oops! Something went wrong
                                </p>
                                <p style={{ color: '#666', marginTop: '10px' }}>
                                    {error}
                                </p>
                            </div>
                        )}

                        {weather && !loading && !error && (
                            <div>
                                <div style={{
                                    textAlign: 'center',
                                    padding: '30px',
                                    background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                                    borderRadius: '15px',
                                    color: 'white',
                                    marginBottom: '25px'
                                }}>
                                    <h2 style={{ fontSize: '24px', marginBottom: '5px' }}>
                                        {weather.location.name}, {weather.location.country}
                                    </h2>
                                    <div style={{ fontSize: '80px', margin: '15px 0' }}>
                                        {getWeatherIcon(weather.current.weathercode)}
                                    </div>
                                    <div style={{ fontSize: '48px', fontWeight: 'bold' }}>
                                        {Math.round(weather.current.temperature)}°C
                                    </div>
                                    <div style={{ fontSize: '20px', marginTop: '10px', opacity: 0.9 }}>
                                        {getWeatherDescription(weather.current.weathercode)}
                                    </div>
                                    <div style={{ 
                                        marginTop: '20px', 
                                        display: 'flex', 
                                        justifyContent: 'center', 
                                        gap: '30px',
                                        fontSize: '14px'
                                    }}>
                                        <span>💨 Wind: {weather.current.windspeed} km/h</span>
                                        <span>🧭 Direction: {weather.current.winddirection}°</span>
                                    </div>
                                </div>

                                <div style={{
                                    display: 'grid',
                                    gridTemplateColumns: 'repeat(3, 1fr)',
                                    gap: '15px'
                                }}>
                                    <div style={{
                                        background: '#f8f9fa',
                                        padding: '20px',
                                        borderRadius: '12px',
                                        textAlign: 'center'
                                    }}>
                                        <div style={{ fontSize: '30px', marginBottom: '5px' }}>💧</div>
                                        <div style={{ color: '#666', fontSize: '14px' }}>Humidity</div>
                                        <div style={{ 
                                            color: '#1e3c72', 
                                            fontSize: '24px', 
                                            fontWeight: 'bold',
                                            marginTop: '5px'
                                        }}>
                                            {weather.hourly.relativehumidity_2m[0] || '--'}%
                                        </div>
                                    </div>
                                    <div style={{
                                        background: '#f8f9fa',
                                        padding: '20px',
                                        borderRadius: '12px',
                                        textAlign: 'center'
                                    }}>
                                        <div style={{ fontSize: '30px', marginBottom: '5px' }}>🌡️</div>
                                        <div style={{ color: '#666', fontSize: '14px' }}>Feels Like</div>
                                        <div style={{ 
                                            color: '#1e3c72', 
                                            fontSize: '24px', 
                                            fontWeight: 'bold',
                                            marginTop: '5px'
                                        }}>
                                            {weather.hourly.apparent_temperature?.[0] ? 
                                                Math.round(weather.hourly.apparent_temperature[0]) + '°C' : '--'}
                                        </div>
                                    </div>
                                    <div style={{
                                        background: '#f8f9fa',
                                        padding: '20px',
                                        borderRadius: '12px',
                                        textAlign: 'center'
                                    }}>
                                        <div style={{ fontSize: '30px', marginBottom: '5px' }}>📈</div>
                                        <div style={{ color: '#666', fontSize: '14px' }}>Elevation</div>
                                        <div style={{ 
                                            color: '#1e3c72', 
                                            fontSize: '24px', 
                                            fontWeight: 'bold',
                                            marginTop: '5px'
                                        }}>
                                            {weather.current.elevation || 0}m
                                        </div>
                                    </div>
                                </div>

                                <h3 style={{ 
                                    marginTop: '30px', 
                                    marginBottom: '15px', 
                                    color: '#333' 
                                }}>
                                    📅 7-Day Forecast
                                </h3>
                                <div style={{
                                    display: 'flex',
                                    overflowX: 'auto',
                                    gap: '10px',
                                    paddingBottom: '10px'
                                }}>
                                    {weather.daily.time.slice(0, 7).map((date, index) => (
                                        <div key={index} style={{
                                            minWidth: '80px',
                                            background: index === 0 ? '#667eea' : '#f8f9fa',
                                            color: index === 0 ? 'white' : '#333',
                                            padding: '15px 10px',
                                            borderRadius: '12px',
                                            textAlign: 'center'
                                        }}>
                                            <div style={{ fontSize: '12px', marginBottom: '5px' }}>
                                                {new Date(date).toLocaleDateString('en-US', { weekday: 'short' })}
                                            </div>
                                            <div style={{ fontSize: '24px', marginBottom: '5px' }}>
                                                {getWeatherIcon(weather.daily.weathercode[index])}
                                            </div>
                                            <div style={{ fontSize: '14px', fontWeight: 'bold' }}>
                                                {Math.round(weather.daily.temperature_2m_max[index])}°
                                            </div>
                                            <div style={{ fontSize: '12px', opacity: 0.7 }}>
                                                {Math.round(weather.daily.temperature_2m_min[index])}°
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WeatherDashboard />);
    </script>
</body>
</html>
